services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8135:8135"
    volumes:
      - lead_rescue_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8135/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  lead_rescue_data:
