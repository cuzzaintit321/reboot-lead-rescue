<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Lead Rescue</title><link rel="stylesheet" href="/static/app.css"></head><body class="login-body"><div class="login-card"><div class="logo big">↗</div><div class="eyebrow">REBOOT SYNDICATE</div><h1>Welcome back.</h1><p>Catch missed calls. Convert more leads.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/login"><label>Email address<input name="email" type="email" autocomplete="username" required placeholder="owner@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary wide">Sign in →</button></form><div class="note">{{ 'Demo mode: messages will not be sent.' if mode == 'demo' else 'Secure business sign-in' }}</div></div></body></html>
